<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>

     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Itim&display=swap" rel="stylesheet">


    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #cce4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-container {
            text-align: center;
        }

        .title {
            color: #004085;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .choice-box {
            background-color: white;
            border: 3px solid #004085;
            border-radius: 20px;
            width: 280px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-decoration: none;
            box-shadow: 0 6px 0px #004085;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .choice-box .icon {
            font-size: 1.8rem;
        }

        .choice-box :hover {
            background-color: #f0f7ff;
            transform: translateY(-2px);
            box-shadow: 0 8px #004085;
        }

        .choice-box :active {
            transform: translateY(4px);
            box-shadow: 0 2px #004085;
        }
    </style>
</head>
<body>
    <div class="register-container">
    <h1 class="title">ลงทะเบียน</h1>
    
    <div class="button-group">
        <a href="student-register.html" class="choice-box student-btn">
            <span class="icon">👩‍🎓</span>
            <span class="text">ลงทะเบียนสำหรับนักศึกษา</span>
        </a>

        <a href="teacher-register.html" class="choice-box teacher-btn">
            <span class="icon">👨‍🏫</span>
            <span class="text">ลงทะเบียนสำหรับอาจารย์</span>
        </a>
    </div>
    </div>

</body>
</html>
