<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teacher</title>
    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Itim", "Tahoma", sans-serif;
    background: linear-gradient(160deg, #d4f1f4, #a3d1d6);
    min-height: 100vh;
    padding: 40px;
}

h1 {
    color: #5c30ad;
    font-size: 2.2rem;
    font-weight: bold;
    text-align: center;          
    max-width: 480px;
    margin: 0 auto 25px;         
}

.card {
    background-color: #59afc0;
    border-radius: 32px;
    padding: 35px 45px;
    max-width: 480px;
    margin: 0 auto;
    box-shadow: 10px 12px 25px rgba(0, 0, 0, 0.3);
}

header p {
    text-align: center;
    color: #f0f8fa;
    margin-top: 0;
    margin-bottom: 20px;
}

label {
    display: block;
    text-align: center;
    font-weight: bold;
    color: #211c3f;
    font-size: 1.2rem;
    margin-bottom: 10px;
}

input[type="text"],
input[type="number"],
textarea {
    width: 100%;
    padding: 12px 14px;
    border: none;
    border-radius: 8px;
    background-color: #cdeef1;
    box-shadow: 4px 5px 10px rgba(0, 0, 0, 0.2);
    font-size: 0.95rem;
    resize: none;
}

input::placeholder,
textarea::placeholder {
    font-style: italic;
    color: #6a7d7f;
}

input:focus,
textarea:focus {
    outline: 2px solid #4a90a4;
}

section {
    margin-bottom: 25px;
}

div.button-wrap {
    text-align: center;
}

button[type="submit"] {
    background-color: #cdeef1;
    border: none;
    color: #250363;
    font-weight: bold;
    padding: 10px 24px;
    border-radius: 8px;
    box-shadow: 4px 5px 10px rgba(0, 0, 0, 0.2);
    cursor: pointer;
    font-size: 1rem;
}

button[type="submit"]:hover {
    background-color: #efff93;
}

.post-card-student-banner {
  background-color: #2ecc71;
  color: #fff;
  font-weight: bold;
  padding: 10px;
  border-radius: 6px;
  margin-top: 10px;
  text-align: center;
}
 
.post-card-confirm-section {
  text-align: center;
  margin-top: 10px;
}
 
.post-card-confirm-label {
  font-weight: bold;
  color: #333;
  margin-bottom: 8px;
}
 
.post-card-confirm-btn {
  background-color: #2e8b47;
  color: #7CFC00;
  font-size: 24px;
  border: none;
  border-radius: 8px;
  padding: 10px 40px;
  cursor: pointer;
}
 
.post-card-status.confirmed {
  background-color: #2ecc71;
  color: #fff;
}

    </style>

</head>
<body>
  
    
        <h1>สร้างโพสประกาศงานใหม่</h1>
        <div class="card">
           <header>
               <p>กรุณากรอกข้อมูลให้ครบถ้วน</p>
            </header>
    

    <main>

        <form>

            <section>

                <label for="post-title">หัวข้อประกาศ:</label>

                <br>

                <input type="text" id="post-title" name="postTitle" placeholder=" เช่น หานักศึกษาช่วยจัดสถานที่" required>

            </section>

            <br>

            <section>
                <label for="post-datails">รายละเอียดการทำงาน:</label>
                <br>

                <textarea id="post-datails" name="postDatails" rows="8" cols="50" placeholder="อธิบายลักษณะงาน คุณสมบัติ และสิ่งที่นักศึกษาต้องทำ" required></textarea>

            </section>

            <br>

            <section>
                <label for="work-hours">จำนวนชั่วโมงที่ต้องปฎิบัติงาน (ชั่วโมง):</label>
                <br>
                <input type="number" id="work-hours" name="workHours" min="1" placeholder="เช่น 2" required>
            </section>

            <div class="button-wrap">
                <button type="submit">กดโพสประกาศ</button>
            </div>
        </form>
    </main>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjf5b4vi0MmEKWW7XFJKwQyISx0Xop2y0oR-nPxADLvPuwq7tkgCZS1aKabBP3dm9J/exec";

    var teacherId;

  const currentUserRaw = localStorage.getItem('currentUser');
  if (!currentUserRaw) {
    alert('กรุณาเข้าสู่ระบบก่อน');
    window.location.href = 'login.html';
  } else {
    const currentUser = JSON.parse(currentUserRaw);
    teacherId = currentUser.ID;
 
    // ----- ดักการ submit ฟอร์มสร้างโพสต์ -----
    document.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault(); // กันไม่ให้หน้ารีเฟรชแบบ GET แบบที่เจอ error
 
      const postTitle = document.getElementById('post-title').value;
      const postDetails = document.getElementById('post-datails').value;
      const workHours = document.getElementById('work-hours').value;
 
      fetch(`${SCRIPT_URL}?action=createPost&teacherId=${encodeURIComponent(teacherId)}&title=${encodeURIComponent(postTitle)}&details=${encodeURIComponent(postDetails)}&workHours=${encodeURIComponent(workHours)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert('โพสต์ประกาศสำเร็จ');
            window.location.href = 'home-teacher.html'; // กลับไปหน้ารายการโพสต์
          } else {
            alert('โพสต์ไม่สำเร็จ: ' + data.message);
          }
        })
        .catch(err => {
          console.error(err);
          alert('เชื่อมต่อไม่สำเร็จ');
        });
    });
  }
</script>

</body>
</html>
